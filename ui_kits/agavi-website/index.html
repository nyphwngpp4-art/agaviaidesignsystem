<!-- @startingPoint section="Screens" subtitle="Agavi marketing website (Home / Services / Pricing)" viewport="1280x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agavi AI — Website</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; background: var(--bone); color: var(--ink); font-family: var(--font-sans); }
    a { color: var(--agave-deep); }
    a:hover { color: var(--terracotta); }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Shell.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="ServicesScreen.jsx"></script>
  <script type="text/babel" src="PricingScreen.jsx"></script>
  <script type="text/babel" data-presets="react">
    function App() {
      const [screen, setScreen] = React.useState("home");
      React.useEffect(() => { window.scrollTo(0, 0); }, [screen]);
      const { Nav, Footer, HomeScreen, ServicesScreen, PricingScreen } = window.AgaviKit;
      return (
        <div>
          <Nav current={screen} onNavigate={setScreen} />
          {screen === "home" && <HomeScreen onNavigate={setScreen} />}
          {screen === "services" && <ServicesScreen onNavigate={setScreen} />}
          {screen === "pricing" && <PricingScreen onNavigate={setScreen} />}
          <Footer />
        </div>
      );
    }
    // Wait for the babel-transpiled kit scripts to register on window.AgaviKit.
    function mount() {
      if (window.AgaviKit && window.AgaviKit.HomeScreen && window.AgaviKit.PricingScreen && window.AgaviKit.ServicesScreen) {
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      } else {
        setTimeout(mount, 40);
      }
    }
    mount();
  </script>
</body>
</html>
