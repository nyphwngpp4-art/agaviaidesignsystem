<!-- @dsCard group="Type" viewport="700x220" name="Newsreader — display serif" subtitle="Headings & ledes · italic = emphasis" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--bone); color: var(--ink);
      font-family: var(--font-serif); padding: 26px 32px; }
    .h1 { font-size: 56px; line-height: 0.97; letter-spacing: -0.03em; font-weight: 400; margin: 0; }
    .h1 em { color: var(--agave-deep); font-style: italic; }
    .lede { font-size: 20px; font-style: italic; font-weight: 300; color: var(--ink-soft);
      margin: 14px 0 0; max-width: 46ch; }
    .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-mute); margin-top: 18px; }
  </style>
</head>
<body>
  <h1 class="h1">Operational intelligence — <em>installed.</em></h1>
  <p class="lede">Not subscriptions — a working operating layer, scoped and delivered on-site.</p>
  <div class="meta">Newsreader · 300 / 400 / 500 · roman + italic · optical sizing</div>
</body>
</html>
