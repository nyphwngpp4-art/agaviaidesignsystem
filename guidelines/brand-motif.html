<!-- @dsCard group="Brand" viewport="700x220" name="Agave motif & diamond" subtitle="Line illustration + the ◇ marker" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--bone); color: var(--ink);
      display: flex; align-items: center; gap: 40px; padding: 0 44px; height: 220px; }
    img { width: 180px; height: 180px; }
    .right { display: grid; gap: 14px; }
    .diamond { font-size: 40px; color: var(--terracotta); line-height: 1; }
    .note { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
      color: var(--ink-mute); text-transform: uppercase; max-width: 34ch; line-height: 1.7; }
  </style>
</head>
<body>
  <img src="../assets/agave-motif.svg" alt="Agave line motif" />
  <div class="right">
    <span class="diamond">◇</span>
    <span class="note">The agave, rendered as single-weight line art in agave-deep — used as an oversized, low-opacity background flourish. The ◇ diamond opens kickers, meta lines, and list items.</span>
  </div>
</body>
</html>
