<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4 → 110px rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--bone); color: var(--ink);
      font-family: var(--font-mono); padding: 28px 32px; }
    .scale { display: flex; align-items: flex-end; gap: 12px; }
    .bar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .fill { width: 22px; background: var(--agave-deep); }
    .val { font-size: 9.5px; color: var(--ink-mute); letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div class="scale">
    <div class="bar"><div class="fill" style="height:4px"></div><span class="val">4</span></div>
    <div class="bar"><div class="fill" style="height:8px"></div><span class="val">8</span></div>
    <div class="bar"><div class="fill" style="height:12px"></div><span class="val">12</span></div>
    <div class="bar"><div class="fill" style="height:16px"></div><span class="val">16</span></div>
    <div class="bar"><div class="fill" style="height:22px"></div><span class="val">22</span></div>
    <div class="bar"><div class="fill" style="height:28px"></div><span class="val">28</span></div>
    <div class="bar"><div class="fill" style="height:36px"></div><span class="val">36</span></div>
    <div class="bar"><div class="fill" style="height:48px"></div><span class="val">48</span></div>
    <div class="bar"><div class="fill" style="height:64px"></div><span class="val">64</span></div>
    <div class="bar"><div class="fill" style="height:80px"></div><span class="val">80</span></div>
    <div class="bar"><div class="fill" style="height:96px"></div><span class="val">96</span></div>
  </div>
</body>
</html>
