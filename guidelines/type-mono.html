<!-- @dsCard group="Type" viewport="700x170" name="JetBrains Mono — labels" subtitle="Kickers, stamps, tags · UPPERCASE + wide tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--bone); color: var(--ink);
      font-family: var(--font-mono); padding: 28px 32px; display: grid; gap: 16px; }
    .kick { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
    .kick .d { color: var(--terracotta); }
    .stamp { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-mute); }
    .tag { display: inline-block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--terracotta); }
    .meta { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
  </style>
</head>
<body>
  <div class="kick"><span class="d">◇ </span>East Valley AI consultancy · founder-led service businesses</div>
  <div class="stamp">AGV—01 · HOMEPAGE</div>
  <div><span class="tag">Relationships + Revenue</span></div>
  <div class="meta">JetBrains Mono · 400 / 500 · tracking 0.12–0.18em</div>
</body>
</html>
