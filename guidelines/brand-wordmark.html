<!-- @dsCard group="Brand" viewport="700x160" name="Wordmark & the dot" subtitle="Agavi. — Newsreader with terracotta period" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--bone); color: var(--ink);
      font-family: var(--font-serif); display: flex; align-items: center; gap: 56px; padding: 0 40px; height: 160px; }
    .mark { font-size: 52px; font-weight: 500; letter-spacing: -0.01em; }
    .mark .dot { color: var(--terracotta); }
    .on-dark { background: var(--ink); color: var(--bone); padding: 20px 28px; font-size: 34px; font-weight: 500; }
    .on-dark .dot { color: var(--terracotta); }
    .note { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
      color: var(--ink-mute); text-transform: uppercase; align-self: center; max-width: 20ch; line-height: 1.6; }
  </style>
</head>
<body>
  <span class="mark">Agavi<span class="dot">.</span></span>
  <span class="on-dark">Agavi<span class="dot">.</span></span>
  <span class="note">No image logo — the wordmark is set in Newsreader. The terracotta period is the only mark.</span>
</body>
</html>
